<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Simple Free Encryption Tool</title>
        <script src="js/jquery-3.1.1.min.js"></script>

        <script src="js/windowSfet.js"></script>

        <script language="javascript">
            /* exported downloadRsaKey, hashMD5, hashSHA256, generateKeys, updateRSAKeys, encryptRSA, decryptRSA, signRSA, verifyRSA, generateRandomKey, encryptAESText, decryptAESText, encryptAESFile, decryptAESFile */
            var keys = {};
            let generatingKeys = false;

            function notify(statusId, type, message, fieldIds = []) {
                const status = document.getElementById(statusId);
                status.className = 'status status-' + type;
                status.textContent = message;
                fieldIds.forEach(markFieldError);
            }

            function markFieldError(fieldId) {
                const field = document.getElementById(fieldId);
                if (!field) return;
                field.classList.add('input-error');
                field.setAttribute('aria-invalid', 'true');
            }

            function clearFieldError(fieldId) {
                const field = document.getElementById(fieldId);
                if (!field) return;
                field.classList.remove('input-error');
                field.removeAttribute('aria-invalid');
            }

            function clearStatus(statusId) {
                const status = document.getElementById(statusId);
                if (!status) return;
                status.classList.remove('status-success', 'status-error', 'status-info');
                status.textContent = '';
            }

            function beginAction(statusId, fieldIds, supersededStatusIds = []) {
                clearStatus(statusId);
                fieldIds.forEach(clearFieldError);
                supersededStatusIds.forEach(clearStatus);
                return statusId;
            }

            function completeAction(statusId, message, fieldIds) {
                fieldIds.forEach(clearFieldError);
                notify(statusId, 'success', message);
            }

            const aesTextFieldIds = ['aesKey', 'aesIv', 'aesNonce', 'aesPlaintext', 'aesEncryptedText'];
            const aesFileFieldIds = ['aesKey', 'aesIv', 'aesNonce', 'aesSourceFile'];
            const rsaFieldIds = ['keySize', 'rsaPublicKey', 'rsaPrivateKey', 'rsaPlaintext', 'rsaEncryptedText', 'rsaSignature'];

            function fileActionFailure(action, error) {
                const message = error && error.message ? error.message : '';
                if (/maximum call stack|invalid string length|too large/i.test(message)) {
                    return 'The selected file is too large for this page to encode for download. It was not changed. Try a smaller file.';
                }
                return 'The selected file could not be ' + action + '. It was not changed. Try a smaller file; if it still fails, use another local encryption tool for this file.';
            }

            function statusForField(fieldId) {
                if (fieldId === 'aesKey') return 'aesKeyStatus';
                if (fieldId === 'aesEncryptedText') return 'aesDecryptStatus';
                if (fieldId.startsWith('aes')) return 'aesStatus';
                if (fieldId === 'rsaPlaintext' || fieldId === 'rsaEncryptedText') return 'rsaTextStatus';
                if (fieldId === 'rsaSignature' || fieldId === 'rsaVerified') return 'rsaSigningStatus';
                if (fieldId.startsWith('rsa')) return 'rsaStatus';
                if (fieldId.startsWith('sha256')) return 'sha256Status';
                return 'md5Status';
            }

            function valueFor(fieldId) {
                const field = document.getElementById(fieldId);
                return 'value' in field ? field.value : field.textContent;
            }

            function fallbackCopy(value) {
                const temporaryField = document.createElement('textarea');
                const focusedElement = document.activeElement;
                temporaryField.value = value;
                temporaryField.setAttribute('readonly', '');
                temporaryField.style.cssText = 'position:fixed; opacity:0; pointer-events:none;';
                document.body.appendChild(temporaryField);
                temporaryField.select();
                // eslint-disable-next-line no-restricted-properties -- Older browsers without Clipboard API need this fallback; failures offer manual copying.
                const copied = document.execCommand('copy');
                temporaryField.remove();
                if (focusedElement) focusedElement.focus();
                if (!copied) throw new Error('copy unavailable');
            }

            async function copyValue(fieldId, label) {
                const value = valueFor(fieldId);
                const statusId = statusForField(fieldId);
                clearFieldError(fieldId);
                if (!value) {
                    notify(statusId, 'error', 'There is no ' + label + ' to copy.', [fieldId]);
                    return;
                }
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(value);
                    } else {
                        fallbackCopy(value);
                    }
                    notify(statusId, 'success', label + ' copied to the clipboard.');
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Could not copy ' + label + '. Select the value and copy it manually.', [fieldId]);
                }
            }

            function downloadRsaKey(fieldId, filename, label) {
                const value = valueFor(fieldId);
                const statusId = 'rsaStatus';
                clearFieldError(fieldId);
                if (!value) {
                    notify(statusId, 'error', 'There is no ' + label + ' to download.', [fieldId]);
                    return;
                }
                const blob = new Blob([value], { type: 'application/x-pem-file;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.setTimeout(() => URL.revokeObjectURL(url), 0);
                notify(statusId, 'success', label + ' download started.');
            }

            function syncExportControls() {
                ['rsaPublicKey', 'rsaPrivateKey'].forEach(fieldId => {
                    const control = document.querySelector('[data-testid="download-' + fieldId + '"]');
                    if (control) control.disabled = !valueFor(fieldId);
                });
            }

            async function hashMD5(){
                const statusId = beginAction('md5Status', ['md5Plaintext']);
                let plaintext = $('#md5Plaintext').val();
                let hash = await sfet.md5.hash(plaintext);
                $('#md5Hash').val(hash);
                completeAction(statusId, 'MD5 hash generated', ['md5Plaintext']);
            }

            async function hashSHA256(){
                const statusId = beginAction('sha256Status', ['sha256Plaintext']);
                let plaintext = $('#sha256Plaintext').val();
                try {
                    let hash = await sfet.sha256.hash(plaintext);
                    $('#sha256Hash').val(hash);
                    completeAction(statusId, 'SHA-256 hash generated', ['sha256Plaintext']);
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Unable to calculate the SHA-256 hash. Check the input and try again.');
                }
            }

            async function generateKeys(){
                if (generatingKeys) return;
                generatingKeys = true;
                const button = document.getElementById('generateRsaKeys');
                const keySize = document.getElementById('keySize');
                button.disabled = true;
                keySize.disabled = true;
                const statusId = beginAction('rsaStatus', ['keySize']);
                notify(statusId, 'info', 'Generating RSA keys locally. This can take a moment.');
                try {
                    await new Promise((resolve) => setTimeout(resolve, 750));
                    keys = await sfet.rsa.generateKeys($('#keySize').val());
                    $('#rsaPublicKey').val(keys.public);
                    $('#rsaPrivateKey').val(keys.private);
                    syncExportControls();
                    completeAction(statusId, keys.keySize + '-bit keys generated in ' + keys.time + 'ms', rsaFieldIds);
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Unable to generate RSA keys. Check the selected key size and try again.');
                } finally {
                    generatingKeys = false;
                    button.disabled = false;
                    keySize.disabled = false;
                }
            }

            function updateRSAKeys(){
                keys.public = $('#rsaPublicKey').val();
                keys.private = $('#rsaPrivateKey').val();
                syncExportControls();
            }

            async function encryptRSA() {
                const statusId = beginAction('rsaTextStatus', ['rsaPublicKey', 'rsaPlaintext']);
                if (!keys || !keys.public || keys.public.length == 0){
                    return notify(statusId, 'error', 'Add an RSA public key before encrypting.', ['rsaPublicKey']);
                }
                let plaintext = $('#rsaPlaintext').val();
                try {
                    let encrypted = await sfet.rsa.encrypt(keys.public, plaintext);
                    $('#rsaEncryptedText').val(encrypted);
                    completeAction(statusId, 'RSA encryption successful', rsaFieldIds);
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Unable to encrypt with this RSA public key. Check the key and message.', ['rsaPublicKey', 'rsaPlaintext']);
                }
            }

            async function decryptRSA() {
                const statusId = beginAction('rsaTextStatus', ['rsaPrivateKey', 'rsaEncryptedText']);
                if (!keys || !keys.private || keys.private.length == 0){
                    return notify(statusId, 'error', 'Add an RSA private key before decrypting.', ['rsaPrivateKey']);
                }
                let encrypted = $('#rsaEncryptedText').val();
                try {
                    let decrypted = await sfet.rsa.decrypt(keys.private, encrypted);
                    $('#rsaPlaintext').val(decrypted);
                    completeAction(statusId, 'RSA decryption successful', rsaFieldIds);
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Unable to decrypt with this RSA private key. Check the key and encrypted text.', ['rsaPrivateKey', 'rsaEncryptedText']);
                }
            }

            function signRSA() {
                const statusId = beginAction('rsaSigningStatus', ['rsaPrivateKey', 'rsaPlaintext']);
                if (!keys || !keys.private || keys.private.length == 0){
                    return notify(statusId, 'error', 'Add an RSA private key before signing.', ['rsaPrivateKey']);
                }
                let plaintext = $('#rsaPlaintext').val();
                try {
                    let signature = sfet.rsa.sign(keys.private, plaintext);
                    $('#rsaSignature').val(signature);
                    completeAction(statusId, 'Unencrypted text signed successfully', rsaFieldIds);
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Unable to sign this message. Check the private key and message.', ['rsaPrivateKey', 'rsaPlaintext']);
                }
            }

            function verifyRSA() {
                const statusId = beginAction('rsaSigningStatus', ['rsaPublicKey', 'rsaPlaintext', 'rsaSignature']);
                if (!keys || !keys.public || keys.public.length == 0){
                    return notify(statusId, 'error', 'Add an RSA public key before verifying.', ['rsaPublicKey']);
                }
                let plaintext = $('#rsaPlaintext').val();
                let signature = $('#rsaSignature').val();
                try {
                    let verified = sfet.rsa.verify(keys.public, plaintext, signature);
                    $('#rsaVerified').text(verified);
                    completeAction(statusId, 'Signature verified successfully', rsaFieldIds);
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Unable to verify this signature. Check the public key, message, and signature.', ['rsaPublicKey', 'rsaPlaintext', 'rsaSignature']);
                }
            }

            function updateAesMode() {
                let mode = $('#aesModeSelector').val();
                let cbcDesc = 'Encryption generates a fresh IV. Save it with the ciphertext. For legacy decryption only, leave the IV blank to use the historical fixed IV. CBC cannot detect tampering.';
                let gcmDesc = '<b>AES-256-GCM</b> encrypts text and checks it for changes. A nonce means &ldquo;number used once.&rdquo; It gives each encryption with the same key a fresh starting value. ' +
                    'The demo generates a new 12-byte nonce for each encryption. Save it with the ciphertext so you can decrypt it later. Reusing a nonce with the same key can expose messages and allow forgeries.';
                if (mode === 'cbc') {
                    $('#aesModeDescription').html(cbcDesc);
                    $('#aesIvRow').show();
                    $('#aesNonceRow').hide();
                } else {
                    $('#aesModeDescription').html(gcmDesc);
                    $('#aesIvRow').hide();
                    $('#aesNonceRow').show();
                }
            }

            async function generateRandomKey(){
                const statusId = beginAction('aesKeyStatus', ['aesKey']);
                $('#aesKey').val(
                    await sfet.utils.randomstring.generate()
                );
                completeAction(statusId, 'A new 32-character AES key is ready.', ['aesKey']);
            }

            async function encryptWithFreshParameter(mode, key, message) {
                if (mode === 'cbc') {
                    const iv = sfet.aes.cbc.generateIv();
                    const encrypted = await sfet.aes.cbc.encrypt(key, message, iv);
                    $('#aesIv').val(iv);
                    return encrypted;
                }
                const nonce = sfet.aes.gcm.generateNonce();
                const encrypted = await sfet.aes.gcm.encrypt(key, message, nonce);
                $('#aesNonce').val(nonce);
                return encrypted;
            }

            async function encryptAESText() {
                const statusId = beginAction('aesStatus', aesTextFieldIds, ['aesDecryptStatus']);
                let mode = $('#aesModeSelector').val();
                let key = $('#aesKey').val();
                let plaintext = $('#aesPlaintext').val();
                if (key.length !== 32) {
                    notify(statusId, 'error', 'Enter or generate a 32-character key before encrypting.', ['aesKey']);
                    return;
                }
                try {
                    const encrypted = await encryptWithFreshParameter(mode, key, plaintext);
                    $('#aesEncryptedText').val(encrypted);
                    completeAction(statusId, 'AES-' + mode.toUpperCase() + ' encryption successful', aesTextFieldIds);
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Unable to encrypt this text. Check the key and message.', ['aesKey', 'aesPlaintext']);
                }
            }

            async function decryptAESText() {
                const mode = $('#aesModeSelector').val();
                const parameterId = mode === 'cbc' ? 'aesIv' : 'aesNonce';
                const statusId = beginAction('aesDecryptStatus', ['aesKey', 'aesEncryptedText', parameterId]);
                let key = $('#aesKey').val();
                let encrypted = $('#aesEncryptedText').val();
                if (key.length !== 32) {
                    notify(statusId, 'error', 'Enter the 32-character key that encrypted this text.', ['aesKey']);
                    return;
                }
                if (!encrypted) {
                    notify(statusId, 'error', 'Paste the encrypted text before decrypting.', ['aesEncryptedText']);
                    return;
                }
                if (!$('#' + parameterId).val() && mode !== 'cbc') {
                    notify(statusId, 'error', 'Paste the saved nonce before decrypting AES-GCM text.', [parameterId]);
                    return;
                }
                try {
                    let decrypted;
                    if (mode === 'cbc') {
                        let iv = $('#aesIv').val();
                        if (iv.length == 0) iv = null;
                        decrypted = await sfet.aes.cbc.decrypt(key, encrypted, iv);
                    } else {
                        let nonce = $('#aesNonce').val();
                        decrypted = await sfet.aes.gcm.decrypt(key, encrypted, nonce);
                    }
                    $('#aesPlaintext').val(decrypted);
                    completeAction(statusId, 'AES-' + mode.toUpperCase() + ' decryption successful', aesTextFieldIds);
                } catch {
                    // Show a safe recovery message rather than exposing crypto or clipboard exception details.
                    notify(statusId, 'error', 'Unable to decrypt this text. Check the key, parameter, and encrypted text.', ['aesKey', 'aesEncryptedText', parameterId]);
                }
            }

            function showAesSelectedOptions(){
                let selected = $('#aesSelector').val();
                switch (selected){
                    case "file":
                        $('.aesTextOptions').hide();
                        $('.aesFileOptions').show();
                        break;
                    case "text":
                        $('.aesTextOptions').show();
                        $('.aesFileOptions').hide();
                        break;
                }
            }

            function encryptAESFile(){
                let mode = $('#aesModeSelector').val();
                let key = $('#aesKey').val();
                let filename = $('#aesSourceFile').val();
                const statusId = beginAction('aesFileStatus', ['aesKey', 'aesSourceFile']);
                if (key.length !== 32) {
                    notify(statusId, 'error', 'Enter or generate a 32-character key before encrypting.', ['aesKey']);
                    return;
                }
                if (!filename || filename.length == 0){
                    return notify(statusId, 'error', 'Choose a source file before encrypting.', ['aesSourceFile']);
                }

                $('#aesResultFile').hide();

                // load file contents into base64
                let reader = new FileReader();
                let file = $('#aesSourceFile')[0].files[0];
                reader.readAsDataURL(file);
                reader.onload = async function () {
                    // strip metadata, encrypt the rest, then reattach
                    let contentIndex = reader.result.indexOf('base64,') + 'base64'.length + 1;
                    let metadata = reader.result.substr(0, contentIndex);
                    let content = reader.result.substr(contentIndex);

                    try {
                        const encrypted = await encryptWithFreshParameter(mode, key, content);
                        $('#aesResultFile').attr('href', metadata + encrypted);

                        // get filename from (fake) full path
                        let strippedFilename = filename.replace(/^.*[\\/]/, '');
                        $('#aesResultFile').attr(
                            'download',
                            strippedFilename + '.encrypted'
                        );

                        completeAction(statusId, 'AES-' + mode.toUpperCase() + ' encryption successful', aesFileFieldIds);
                        $('#aesResultFile').show();
                    } catch (error) {
                        notify(statusId, 'error', fileActionFailure('encrypted', error), ['aesSourceFile']);
                    }
                };
                reader.onerror = function () {
                    return notify(statusId, 'error', 'The selected file could not be read. Choose the file again and retry.', ['aesSourceFile']);
                };
            }

            function decryptAESFile(){
                let mode = $('#aesModeSelector').val();
                let key = $('#aesKey').val();
                let filename = $('#aesSourceFile').val();
                let parameterId = mode === 'cbc' ? 'aesIv' : 'aesNonce';
                const statusId = beginAction('aesFileStatus', ['aesKey', 'aesSourceFile', parameterId]);
                if (key.length !== 32) {
                    notify(statusId, 'error', 'Enter the 32-character key that encrypted this file.', ['aesKey']);
                    return;
                }
                if (!filename || filename.length == 0){
                    return notify(statusId, 'error', 'Choose an encrypted source file before decrypting.', ['aesSourceFile']);
                }
                if (!$('#' + parameterId).val() && mode !== 'cbc') {
                    notify(statusId, 'error', 'Paste the saved nonce before decrypting an AES-GCM file.', [parameterId]);
                    return;
                }

                $('#aesResultFile').hide();

                // load file contents into base64
                let reader = new FileReader();
                let file = $('#aesSourceFile')[0].files[0];
                reader.readAsDataURL(file);
                reader.onload = async function () {
                    // strip metadata, decrypt the rest, then reattach
                    let contentIndex = reader.result.indexOf('base64,') + 'base64'.length + 1;
                    let metadata = reader.result.substr(0, contentIndex);
                    let content = reader.result.substr(contentIndex);

                    try {
                        let decrypted;
                        if (mode === 'cbc') {
                            let iv = $('#aesIv').val();
                            if (iv.length == 0) iv = null;
                            decrypted = await sfet.aes.cbc.decrypt(key, content, iv);
                        } else {
                            let nonce = $('#aesNonce').val();
                            decrypted = await sfet.aes.gcm.decrypt(key, content, nonce);
                        }
                        $('#aesResultFile').attr('href', metadata + decrypted);

                        // get filename from (fake) full path
                        let strippedFilename = filename.replace(/^.*[\\/]/, '');
                        // remove '.encrypted' extension if it's there
                        let encryptedExtensionIndex = strippedFilename.lastIndexOf('.encrypted');
                        if (encryptedExtensionIndex >= 0) {
                            strippedFilename = strippedFilename.substr(0, encryptedExtensionIndex);
                        }
                        $('#aesResultFile').attr('download', strippedFilename);

                        completeAction(statusId, 'AES-' + mode.toUpperCase() + ' decryption successful', aesFileFieldIds);
                        $('#aesResultFile').show();
                    } catch (error) {
                        notify(statusId, 'error', fileActionFailure('decrypted', error), ['aesSourceFile']);
                    }
                };
                reader.onerror = function () {
                    return notify(statusId, 'error', 'The selected file could not be read. Choose the file again and retry.', ['aesSourceFile']);
                };
            }

            function icon(path) {
                return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + path + '</svg>';
            }

            function copyButton(fieldId, label, testId) {
                const testAttribute = testId ? ' data-testid="' + testId + '"' : '';
                return `<button type="button" class="icon-button"${testAttribute} data-copy-field="${fieldId}" data-copy-label="${label}" title="Copy ${label}" aria-label="Copy ${label}">${icon('<rect x="8" y="8" width="10" height="12" rx="1"/><path d="M16 8V5a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h2"/>')}</button>`;
            }

            function downloadButton(fieldId, filename, label) {
                return `<button type="button" class="icon-button" data-testid="download-${fieldId}" title="Download ${label}" aria-label="Download ${label}" onclick="downloadRsaKey('${fieldId}', '${filename}', '${label}')">${icon('<path d="M12 3v11"/><path d="m8 10 4 4 4-4"/><path d="M5 20h14"/>')}</button>`;
            }

            function renderDemo() {
                if (document.getElementById('sfetDemo')) return;
                const surface = document.createElement('template');
                surface.innerHTML = `
                    <main id="sfetDemo" class="app-shell">
                        <header class="hero">
                            <p class="eyebrow">Browser encryption demo</p>
                            <h1>Simple Free Encryption Tool</h1>
                            <p class="lede">Explore hashing, RSA, and AES with the same library used in Node.js. Deliberately copy or download values when you need to use them outside this page.</p>
                            <p class="privacy-note"><strong>Local-only processing.</strong> Your text, keys, and results stay in this page until you explicitly copy a value or download a file. Refreshing clears the page.</p>
                        </header>
                        <div class="tools">
                            <details id="demo-aes" open>
                                <summary title="Show or hide AES encryption tools">AES encryption</summary>
                                <div class="section-content">
                                    <p class="section-intro">Encrypt text or a local file with a 32-character key. GCM is the recommended default because it detects changed ciphertext.</p>
                                    <div class="field"><label for="aesModeSelector">1. Select AES mode</label><select id="aesModeSelector" title="Select AES encryption mode" onchange="updateAesMode()"><option value="cbc">CBC — legacy compatibility</option><option value="gcm" selected>GCM — authenticated encryption</option></select></div>
                                    <p id="aesModeDescription" class="mode-description" aria-live="polite"></p>
                                    <div class="form-grid">
                                        <div class="field"><p id="aesKeyStatus" data-testid="aes-key-status" class="status field-status" role="status" aria-live="polite"></p><label for="aesKey">2. Key (32 chars)</label><div class="value-control"><input id="aesKey" title="AES encryption key" />${copyButton('aesKey', 'AES key', 'copy-aesKey')}<button type="button" class="secondary" title="Generate a random AES key" onclick="generateRandomKey()">Generate key</button></div><p class="field-help">Generate a new key to encrypt, or paste the same key to decrypt. Keep it secret and separate from the encrypted text.</p></div>
                                        <div id="aesIvRow" class="field"><label for="aesIv">IV:</label><div class="value-control single"><input id="aesIv" title="AES CBC initialization vector" />${copyButton('aesIv', 'AES IV', 'copy-aesIv')}</div></div>
                                        <div id="aesNonceRow" class="field"><label for="aesNonce">3. Nonce</label><div class="value-control single"><input id="aesNonce" title="AES GCM nonce" />${copyButton('aesNonce', 'AES nonce', 'copy-aesNonce')}</div><p class="field-help">A fresh nonce is created when you encrypt. To decrypt later, paste the nonce saved with that encrypted text.</p></div>
                                    </div>
                                    <div id="aesSelectorDiv" class="field"></div>
                                    <div class="transform-grid aesTextOptions">
                                        <div class="field"><p id="aesStatus" data-testid="aes-status" class="status field-status" role="status" aria-live="polite"></p><label for="aesPlaintext">Unencrypted text</label><div class="value-control single"><textarea id="aesPlaintext" title="Text to encrypt or decrypted result"></textarea>${copyButton('aesPlaintext', 'unencrypted text', 'copy-aesPlaintext')}</div></div>
                                        <div class="transform-actions"><button type="button" data-testid="encrypt-aes" title="Encrypt the unencrypted text" onclick="encryptAESText()">Encrypt →</button><button type="button" class="secondary" data-testid="decrypt-aes" title="Decrypt the encrypted text" onclick="decryptAESText()">← Decrypt</button></div>
                                        <div class="field"><p id="aesDecryptStatus" data-testid="aes-decrypt-status" class="status field-status" role="status" aria-live="polite"></p><label for="aesEncryptedText">Encrypted text</label><div class="value-control single"><textarea id="aesEncryptedText" title="Encrypted AES text"></textarea>${copyButton('aesEncryptedText', 'encrypted text', 'copy-aesEncryptedText')}</div></div>
                                    </div>
                                    <div class="aesFileOptions"><div class="field"><p id="aesFileStatus" data-testid="aes-file-status" class="status field-status" role="status" aria-live="polite"></p><label for="aesSourceFile">Source File:</label><input type="file" id="aesSourceFile" title="Choose a local source file" /></div><div class="actions"><button type="button" data-testid="encrypt-aes-file" title="Encrypt selected local file" onclick="encryptAESFile()">Encrypt file</button><button type="button" data-testid="decrypt-aes-file" class="secondary" title="Decrypt selected local file" onclick="decryptAESFile()">Decrypt file</button><a id="aesResultFile" title="Download the processed file">Download result</a></div></div>
                                </div>
                            </details>
                            <details id="demo-rsa" open>
                                <summary title="Show or hide RSA tools">RSA keys, encryption, and signing</summary>
                                <div class="section-content">
                                    <p class="section-intro">RSA is for short secrets and signatures. Generate keys locally, then copy or download only the PEM values you deliberately choose to export.</p>
                                    <div class="rsa-generation"><div class="actions"><label class="field" for="keySize">Key size<select id="keySize" title="Select RSA key size"><option value="2048" selected>2048 bits</option><option value="4096">4096 bits</option></select></label><button id="generateRsaKeys" data-testid="generate-rsa-keys" type="button" title="Generate a new RSA key pair" onclick="generateKeys()">Generate key pair</button></div><p id="rsaStatus" data-testid="rsa-status" class="status field-status" role="status" aria-live="polite"></p></div>
                                    <div class="form-grid">

                            <details id="demo-sha256" open><summary title="Show or hide SHA-256 tools">SHA-256 checksum</summary><div class="section-content"><p class="section-intro">Create a checksum to compare with a separately trusted value. A checksum does not encrypt text or prove who sent it.</p><div class="form-grid"><div class="field"><label for="sha256Plaintext">Text to hash</label><div class="value-control single"><textarea id="sha256Plaintext" title="Text for SHA-256 hashing"></textarea>${copyButton('sha256Plaintext', 'SHA-256 input', 'copy-sha256Plaintext')}</div></div><div class="field"><label for="sha256Hash">SHA-256 hash</label><div class="value-control single"><textarea id="sha256Hash" readonly title="SHA-256 hash result"></textarea>${copyButton('sha256Hash', 'SHA-256 hash', 'copy-sha256Hash')}</div></div></div><div class="actions"><button type="button" data-testid="hash-sha256" title="Calculate SHA-256 hash" onclick="hashSHA256()">Calculate hash</button></div><p id="sha256Status" data-testid="sha256-status" class="status tool-status" role="status" aria-live="polite"></p></div></details>

        <h1>Simple Free Encryption Tool</h1>
        <b>Simple Free Encryption Tool (sfet)</b> uses RSA and AES versions that are strong and allow
        encryption between client-side Javascript and Node.js.
        <br />
        <br />
        Open and free for all to see, can be run stand-alone for extra security,
        <br />
        see <a href="https://github.com/therightstuff/simple-free-encryption-tool" target="_blank">https://github.com/therightstuff/simple-free-encryption-tool</a>
        <br />
        <br />
        If you've found this tool useful,
        <a href="https://www.industrialcuriosity.com/p/donate.html" target="_blank">please
        consider making a donation</a>!
        <br /><br />
        <b><u>Encryption 101</u></b>:
        <br />
            RSA encryption operates on a very limited string length, it is generally used to asymmetrically
            encrypt a shared secret that in turn is used for symmetric encryption. The standard use-case is
            to generate a random shared secret and transmit it encrypted with the destination's public RSA
            key. Once the destination has decrypted the shared secret with its private RSA key both sides
            will be able to use that secret to encrypt and decrypt communication with AES.
            <br />
            <br />
            Signing a message to prove authorship (and that it hasn't been tampered with) is performed on
            the plaintext message, and the resulting signature can only be verified with the public key
            matching the private key it was signed with. The padding for signing and verifying signatures
            is not the same as for encrypting and decrypting messages.
        <br />
        <br />
        <b><u>File Encryption</u></b>:
        <br />
            If your browser supports it, you will be able to encrypt and decrypt files from this interface.
            The file metadata (eg. MIME type) will not be encrypted, only the file contents.
